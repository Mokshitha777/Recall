spring.application.name=recall
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/recall_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
app.jwt.secret=${APP_JWT_SECRET:recall-local-development-secret-change-this-32bytes-minimum}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:gpt-4o-mini}
app.ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
